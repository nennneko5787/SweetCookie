org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# Loom, ModDevGradle and Stonecutter are not all configuration-cache clean as of 2026-07.
# The `core` build IS clean and is built with it enabled separately. Revisit periodically.
org.gradle.configuration-cache=false

# The daemon must run on the newest JDK any node needs (26.2 requires Java 25); each node
# then targets its own release via a toolchain. Foojay provisions what is missing.
org.gradle.java.installations.auto-download=true

# Read by dev.kikugie.loom-back-compat, which picks net.fabricmc.fabric-loom-remap for the
# obfuscated nodes and net.fabricmc.fabric-loom for the unobfuscated ones. Its default
# predicate is `sc.current.parsed > "26"`, which is exactly the 26.1 deobfuscation seam.
loomx.loom_version=1.17.17
