# A worked example of a conformance case. See spec/conformance/README.md.
#
# Schema: spec/schemas/conformance-case.schema.json

id: packaging/format_version_sniffing
tier: T0
# SC-180, not SC-110. The rule being tested is SC-110 §3.1's structural sniffing, but the features
# proved are geometry families, and SC-110 §3.1 itself says the sniffing rules for a content kind
# live in that kind's domain document. `specConformance` caught this the first time it ran: the
# (spec, feature) pair is the unique key, and `SC-110#geometry/family_1_8` names nothing.
spec: SC-180

features:
  - geometry/family_1_8
  - geometry/family_modern
  - geometry/bones
  - geometry/cubes
  - geometry/box_uv
  - geometry/per_face_uv
  - geometry/visible_bounds

description: >-
  A geometry file that DECLARES format_version 1.8.0 but is written in the modern
  `minecraft:geometry` shape must be parsed as modern, and vice versa. Real authoring tools have
  shipped this mismatch for years, so trusting the declared version means silently failing to load
  a large fraction of community models — the bones parse as empty and the entity renders as nothing
  at all, with no error a pack author could act on.

pack:
  extends: minimal_rp
  dir: pack
  container: directory

diagnostics:
  expected:
    - SCE-1031          # declared format_version contradicts the file's structure
  forbidden:
    - SCE-1030          # must NOT fall back to the lowest registered parser
    - SCE-1035          # nothing in this corpus is malformed
    - SCE-1036          # nothing required is missing
  exhaustive: true

expect:
  ir: expected/ir.json

assert:
  # The lying file declares 1.8.0 and is modern. The structure wins, and the declaration is kept so
  # a diagnostic can quote both.
  - that: ir.packs[0].resource.geometries['geometry.sc_lying_declaration'].sourceFamily
    equals: modern
  - that: ir.packs[0].resource.geometries['geometry.sc_lying_declaration'].declaredVersion
    equals: 1.8.0
  - that: ir.packs[0].resource.geometries['geometry.sc_lying_declaration'].effectiveVersion
    equals: 1.12.0
  - that: ir.packs[0].resource.geometries['geometry.sc_lying_declaration'].lossy
    equals: "true"
  - that: ir.packs[0].resource.geometries['geometry.sc_lying_declaration'].bones[0].name
    equals: sc_root

  # The honest file is what it says it is, and gets no sniffing diagnostic of its own.
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].sourceFamily
    equals: legacy_1_8
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].lossy
    equals: "false"

  # Box UV expands to per-face UV at parse time, because the reverse is not expressible (SC-180 §3).
  # The 8x8x8 cube at uv [0, 0]: north sits one depth in on both axes, up sits above it.
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].bones[0].cubes[0].uv.north.uv
    equals: "[8,8]"
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].bones[0].cubes[0].uv.north.uvSize
    equals: "[8,8]"
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].bones[0].cubes[0].uv.up.uv
    equals: "[8,0]"
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].bones[0].cubes[0].uv.west.uv
    equals: "[0,8]"

  # Both families normalise to the same shape: nothing downstream can tell them apart by structure.
  - that: ir.packs[0].resource.geometries['geometry.sc_lying_declaration'].bones[0].cubes[0].uv.north.uvSize
    equals: "[8,8]"
  - that: ir.packs[0].resource.geometries['geometry.sc_honest_legacy'].visibleBounds.height
    equals: "2"
