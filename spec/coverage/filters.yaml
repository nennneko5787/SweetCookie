# Filter tests — SC-140
#
# All 106 Bedrock filter tests. This is a DECLARATIVE predicate system, separate from Molang:
# {"test": …, "subject": …, "operator": …, "domain": …, "value": …} combined with
# all_of / any_of / none_of. It accepts no expressions.
#
# Filters run on the AI hot path — every goal's canUse, every tick, for every entity — so they are
# compiled at ingest, not interpreted from JSON. An unknown test evaluates to FALSE (safer than
# true: an unimplemented test makes a behaviour not happen rather than happen unconditionally) and
# emits one diagnostic per site, once, not per evaluation.

domain: filters
spec: SC-140
upstream:
  - source: "metadata/doc_modules/entities.json"
    nodePath:
      - "Filters"

