# Typed entity properties (description.properties) plus the 49 flag-like components.
#
# Properties are queryable as q.property(), settable by events, and mirrored to Geyser subject to its
# caps of 32 per type, 16 enum values and 32-character names. They are synced over SweetCookie's own
# sideband, NEVER SynchedEntityData (constitution rule 6) - which is what removes the entire class of
# ViaVersion metadata-index failures.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: entity-properties
spec: SC-160
upstream:
  - source: "metadata/doc_modules/entities.json"
    nodePath:
      - "Server Entity Documentation"
      - "Properties"

entries:
  - id: property/bool
    status: stub
  - id: property/int
    status: stub
  - id: property/float
    status: stub
  - id: property/enum
    status: stub
    notes: >-
      Geyser caps enum members at 16 with 32-character names.
