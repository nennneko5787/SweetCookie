# SweetCookie coverage ledger — shard index
#
# THE LOAD-BEARING ARTIFACT OF THIS SPECIFICATION. Constitution rule 9.
#
# One entry per Bedrock feature identifier, with a status, the implementing class, an OBSERVABLE
# fidelity note, and a link to the conformance case that proves it. CI does not trust any of that:
# `specImplCheck` and `specConformance` verify the links exist in both directions, and
# `specUpstreamDiff` fails the build when Mojang ships a feature identifier this ledger does not
# know about.
#
# A human NEVER writes `status: implemented`. `specReport` promotes an entry when its conformance
# cases pass. See spec/process.md section 4.
#
# `seeded` says where a shard's entries came from:
#   upstream  generated from the pinned snapshot and verified by specUpstreamDiff
#   full      hand-written and believed complete
#   partial   hand-written from research; gaps are likely
#   manual    not a Mojang-enumerated list at all
#
# The upstream SELECTORS live in each shard, not here. This index used to duplicate them, and every
# duplicated pointer turned out to be wrong - which is exactly how a second copy fails.

version: 1

# Where the authoritative feature lists come from. Pinned in spec/upstream/bedrock-samples.lock.json.
# NEVER VENDORED — constitution rule 10.
upstreamRepository: https://github.com/Mojang/bedrock-samples

shards:
