# Translated into the virtual resource pack.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: rp-lang-font
spec: SC-180
upstream: null

entries:
  - id: texts/lang_files
    status: partial
    impl: net.nennneko5787.lepus.runtime.registry.BlockBinding
    fields:
      add_on_content: ok
      vanilla_rename: ok
      font_and_glyphs: missing
    fidelity: >-
      A pack's `.lang` entries reach the generated pack's own language files, and both kinds of key
      are read. An add-on's own content is keyed by the identifier it declared; a VANILLA item is
      keyed by Bedrock's internal short name - `item.totem.name` - which is a different spelling
      from Java's for 525 of the 1,437 names that can be matched at all, and is resolved through the
      generated equivalence table (SC-120 section 2.1). A short name with no unambiguous answer is
      left alone and the item keeps its vanilla name.

      This lands in Lepus's own namespace and still overrides vanilla, because a language is merged
      across every namespace and every pack in load order. No file of Mojang's is replaced for the
      naming half; the picture half needs a real override and has one.

      `minecraft:display_name` holds a KEY rather than a name and is followed, which is how spawn
      eggs and the 18 items borrowing their key resolve at all.
  - id: font/glyph_pages
    status: stub
    notes: >-
      256x256 atlases in a 16x16 grid.
  - id: font/default8
    status: stub
  - id: font/glyph_sizes
    status: stub
    notes: >-
      Binary width table.
