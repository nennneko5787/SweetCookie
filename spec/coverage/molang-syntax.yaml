# Grammar-level features, tracked separately from queries because a missing construct fails at PARSE
# time and takes a whole expression with it, whereas a missing query degrades one value.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: molang-syntax
spec: SC-130
upstream: null

entries:
  - id: syntax/arithmetic
    status: stub
    notes: >-
      ADR-0012: the chosen expression compiler evaluates in double throughout, so intermediate values
      inside one expression will be double-width and only the result narrows to float. Concretely
      0.1 + 0.2 > 0.3 will be true here and is false on Bedrock. This becomes a `fidelity` note the
      moment the evaluator lands; it is recorded now so the decision is not rediscovered later.
  - id: syntax/comparison
    status: stub
    notes: >-
      Inherits the width divergence in syntax/arithmetic: a comparison whose operands land within
      about one part in sixteen million of each other can resolve the opposite way. ADR-0012.
  - id: syntax/logical
    status: stub
    notes: >-
      GATED BY min_engine_version. Bedrock changed the precedence at 1.18.20 — AND binds before OR,
      and comparison before equality — and kept the old order for packs declaring less. This build
      implements the modern order only. SC-130 section 2.7.
  - id: syntax/ternary
    status: stub
    notes: >-
      GATED BY min_engine_version. Bedrock fixed the associativity at 1.18.10, so
      `A ? B : C ? D : E` groups as `A ? B : (C ? D : E)` there and the other way below it. This
      build implements the modern grouping only, and nothing passes the manifest's version to the
      compiler. SC-130 section 2.7.
  - id: syntax/binary_if
    status: stub
    notes: >-
      `a ? b` with no else, yielding 0 when false. Distinct from ternary.
  - id: syntax/null_coalesce
    status: stub
  - id: syntax/this
    status: partial
    impl: net.nennneko5787.lepus.core.molang.MolangCompiler
    fields:
      value: ok
      context_supplied: partial
    fidelity: >-
      "The current value that this expression will ultimately write to (context specific)" —
      Microsoft's own syntax guide, and the parenthesis is the design: WHICH value depends on what
      is evaluating. So the compiler emits a read and MolangContext.thisValue answers it.

      A context that cannot answer returns zero, which is not a lie: an animation applied straight
      onto a bind pose genuinely has nothing underneath it. The only context that supplies a real
      value today is the animation sampler, and it supplies zero for the same reason — until
      animations blend, nothing has written to the channel.

      Found because a real pack used it: `query.target_x_rotation - 110.0 - this` aims an arm
      relative to wherever the animations below it left the arm, and the whole expression failed to
      compile without it.
    notes: >-
      Takes no scope and no dot, unlike every other value. It is a keyword, not a variable.

  - id: syntax/deref
    status: stub
    notes: >-
      The -> operator. The right side evaluates in the left side's entity context.
  - id: syntax/statements
    status: stub
    notes: >-
      Multi-statement bodies must end in return.
  - id: syntax/assignment
    status: stub
    notes: >-
      Only variable. and temp. are assignable.
  - id: syntax/loop
    status: stub
    notes: >-
      Iteration is capped by SC-260 - an unbounded loop hangs a frame.
  - id: syntax/for_each
    status: stub
  - id: syntax/break_continue
    status: stub
  - id: syntax/arrays
    status: stub
    notes: >-
      Indices floor and wrap, so out of range is not an error.
  - id: syntax/structs
    status: stub
  - id: syntax/case_insensitivity
    status: stub
    notes: >-
      Everything except string literals.
