# Grammar-level features, tracked separately from queries because a missing construct fails at PARSE
# time and takes a whole expression with it, whereas a missing query degrades one value.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: molang-syntax
spec: SC-130
upstream: null

entries:
  - id: syntax/arithmetic
    status: stub
    notes: >-
      ADR-0012: the chosen expression compiler evaluates in double throughout, so intermediate values
      inside one expression will be double-width and only the result narrows to float. Concretely
      0.1 + 0.2 > 0.3 will be true here and is false on Bedrock. This becomes a `fidelity` note the
      moment the evaluator lands; it is recorded now so the decision is not rediscovered later.
  - id: syntax/comparison
    status: stub
    notes: >-
      Inherits the width divergence in syntax/arithmetic: a comparison whose operands land within
      about one part in sixteen million of each other can resolve the opposite way. ADR-0012.
  - id: syntax/logical
    status: stub
  - id: syntax/ternary
    status: stub
  - id: syntax/binary_if
    status: stub
    notes: >-
      `a ? b` with no else, yielding 0 when false. Distinct from ternary.
  - id: syntax/null_coalesce
    status: stub
  - id: syntax/deref
    status: stub
    notes: >-
      The -> operator. The right side evaluates in the left side's entity context.
  - id: syntax/statements
    status: stub
    notes: >-
      Multi-statement bodies must end in return.
  - id: syntax/assignment
    status: stub
    notes: >-
      Only variable. and temp. are assignable.
  - id: syntax/loop
    status: stub
    notes: >-
      Iteration is capped by SC-260 - an unbounded loop hangs a frame.
  - id: syntax/for_each
    status: stub
  - id: syntax/break_continue
    status: stub
  - id: syntax/arrays
    status: stub
    notes: >-
      Indices floor and wrap, so out of range is not an error.
  - id: syntax/structs
    status: stub
  - id: syntax/case_insensitivity
    status: stub
    notes: >-
      Everything except string literals.
