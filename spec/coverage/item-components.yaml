# minecraft:item components — SC-170
#
# The 44 components of the post-1.20.50 item shape, from the 1.26.30 schema.
# Registration is SC-120 section 4: ONE carrier Item, identity in minecraft:custom_data.
# Almost everything here maps to a Java DATA COMPONENT, i.e. per stack, which is why items
# hot-plug with zero per-item registrations.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: item-components
spec: SC-170
upstream:
  - source: "metadata/json_schemas/server/item/1.26.30/Item Components.json"
    pointer: "/properties"

entries:
  # ── Stack identity and size ────────────────────────────────────────────────
  - id: minecraft:max_stack_size
    status: partial
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    bedrockSince: "1.20.50"
    fields:
      max_stack_size: ok
    fidelity: >-
      Clamped into 1..99, which is Java's own range: a pack asking for more gets 99 rather than a
      refused item.

      An item that also declares durability is forced to a stack of ONE, because Java refuses a
      stack carrying max_damage with a stack size above 1. The other way round - dropping the
      durability - would make every piece of armour in the surveyed corpus unbreakable.
    notes: Java minecraft:max_stack_size. Per-stack since 1.20.5, which is what makes the carrier design work.

  - id: minecraft:stacked_by_data
    status: stub
    notes: Legacy aux/damage-value stacking. Java has no aux value; custom_data equality already separates distinct items.

  - id: minecraft:should_despawn
    status: stub
    notes: Java ItemEntity lifetime.

  # ── Durability and repair ──────────────────────────────────────────────────
  - id: minecraft:durability
    status: partial
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    fields:
      max_durability: ok
      damage_chance: missing
    fidelity: >-
      max_durability becomes Java's minecraft:max_damage, with minecraft:damage set to zero so the
      stack starts whole and shows a durability bar.

      damage_chance has no Java counterpart. Bedrock wears an item down probabilistically per use;
      Java always spends one point. An item declaring a chance below 1 therefore wears out FASTER
      here than in Bedrock, by the ratio of the chance.
    notes: Java minecraft:max_damage plus minecraft:damage.

  - id: minecraft:repairable
    status: stub
    notes: Java minecraft:repairable. Bedrock lists repair items with a per-item repair amount expression.

  - id: minecraft:damage_absorption
    status: stub

  - id: minecraft:durability_sensor
    status: stub
    notes: Fires events at durability thresholds. No Java counterpart; needs a behaviour hook.

  # ── Combat and tools ───────────────────────────────────────────────────────
  - id: minecraft:damage
    status: stub
    notes: Java attribute modifier on the stack.

  - id: minecraft:digger
    status: stub
    notes: >-
      Bedrock lists per-block destroy speeds; Java uses minecraft:tool with rules over block tags.
      Not a mechanical conversion — see SC-170.

  - id: minecraft:kinetic_weapon
    status: stub
    bedrockSince: "1.21.100"

  - id: minecraft:piercing_weapon
    status: stub
    bedrockSince: "1.21.100"

  - id: minecraft:swing_duration
    status: stub

  - id: minecraft:swing_sounds
    status: stub

  - id: minecraft:shooter
    status: stub
    notes: Ranged weapon definition. Behaviour hook on use.

  - id: minecraft:projectile
    status: stub
    notes: Makes the item a projectile when fired. Behaviour hook.

  - id: minecraft:throwable
    status: stub
    notes: Behaviour hook on use.

  # ── Consumption ────────────────────────────────────────────────────────────
  - id: minecraft:food
    status: stub
    notes: Java minecraft:food plus minecraft:consumable.

  - id: minecraft:use_animation
    status: stub
    notes: Java minecraft:consumable animation field.

  - id: minecraft:use_modifiers
    status: stub
    notes: Use duration and movement modifier. Partly minecraft:consumable, partly a behaviour hook.

  - id: minecraft:cooldown
    status: stub
    bedrockSince: "1.20.10"
    notes: Java minecraft:use_cooldown.

  - id: minecraft:fuel
    status: stub

  - id: minecraft:compostable
    status: stub
    bedrockSince: "1.21.60"

  # ── Placement ──────────────────────────────────────────────────────────────
  - id: minecraft:block_placer
    status: stub
    notes: Behaviour hook on useOn. The main way an add-on item places a custom block.

  - id: minecraft:entity_placer
    status: stub

  # ── Wearing and holding ────────────────────────────────────────────────────
  - id: minecraft:wearable
    status: partial
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    fields:
      slot: partial
      protection: partial
      dispensable: missing
    fidelity: >-
      slot.armor.head/chest/legs/feet and slot.weapon.offhand map onto Java's equipment slots. Plain
      `slot.armor`, which is legal Bedrock and means any armour slot, has no Java equivalent -
      an equippable names exactly one - so the item is left unwearable rather than assigned a slot
      by guess. A guessed slot would put boots on somebody's face and look deliberate.

      protection becomes an `armor` attribute modifier of the same number. THE SCALES HAVE NOT BEEN
      COMPARED: Bedrock states protection on its own scale and Java's armor attribute is points of a
      twenty-point bar. Nothing here has been measured against a Bedrock client.

      The worn model is vanilla's, because Bedrock's is an attachable and those need the SC-180
      render stack. So a piece of armour equips, protects and shows its durability, and looks like
      nothing on the player.
    notes: Java minecraft:equippable.

  - id: minecraft:hand_equipped
    status: stub
    notes: Whether the item renders as a tool in hand. Interacts with attachables.

  - id: minecraft:allow_off_hand
    status: stub

  # ── Enchanting ─────────────────────────────────────────────────────────────
  - id: minecraft:enchantable
    status: partial
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    fields:
      value: ok
      slot: missing
    fidelity: >-
      value becomes Java's minecraft:enchantable, which is the same idea under the same name.

      Bedrock's `slot` says which enchantments may apply (armor_head, sword, bow…). Java decides
      that from item tags instead, and the carrier item is in no tag by design (SC-120 section 4) -
      being in one would let vanilla recipes and mechanics touch it. So an enchantable item offers
      Java's generic set rather than the Bedrock-appropriate one.
    notes: Java minecraft:enchantable.

  - id: minecraft:glint
    status: implemented
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    fields:
      glint: ok
    notes: Java minecraft:enchantment_glint_override. See minecraft:foil for the spelling packs use.

  - id: minecraft:foil
    status: implemented
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    fields:
      foil: ok
    notes: >-
      The older spelling of minecraft:glint, and THE ONE REAL PACKS USE. A survey of six installed
      add-ons found 35 items declaring `foil` and none declaring `glint`. Reading only the name the
      newest schema gives would have looked complete and done nothing, which is why this entry
      exists separately rather than being folded into the other as a note.

  # ── Display ────────────────────────────────────────────────────────────────
  - id: minecraft:display_name
    status: partial
    impl: net.nennneko5787.lepus.core.format.ir.item.ItemProfile
    conformance: [item/components]
    fields:
      value: ok
      legacy_string_form: ok
    fidelity: >-
      The component holds a LANG KEY, not a name, and it is carried as one: the key travels in the
      item and the client picks the language (SC-170, DisplayNames). Resolving it to text at bind
      time would bake one language into the item for every player.

      A key naming an entry no enabled pack ships falls back to the item's own
      item.<identifier>.name, and then to a readable form of the identifier. So a broken key costs
      the translation and never the item.

      NOT applied to blocks. Bedrock allows the component there too and no block in the surveyed
      corpus uses it; a block's name still comes from tile.<identifier>.name alone.
    notes: Java minecraft:item_name. May be a .lang key.

  - id: minecraft:icon
    status: stub
    notes: >-
      Names a key in item_texture.json, not a path. Becomes a generated Java items/ model definition
      referenced by minecraft:item_model.

  - id: minecraft:rarity
    status: stub

  - id: minecraft:hover_text_color
    status: stub

  - id: minecraft:interact_button
    status: stub
    notes: Touch-control interaction label. No Java surface; likely wontfix once assessed.

  # ── Storage ────────────────────────────────────────────────────────────────
  - id: minecraft:storage_item
    status: stub
    notes: Java minecraft:bundle_contents where the shape fits.

  - id: minecraft:storage_weight_limit
    status: stub

  - id: minecraft:storage_weight_modifier
    status: stub

  - id: minecraft:bundle_interaction
    status: stub

  # ── World interaction ──────────────────────────────────────────────────────
  - id: minecraft:liquid_clipped
    status: stub

  - id: minecraft:fire_resistant
    status: stub
    notes: Java minecraft:damage_resistant with the is_fire tag.

  - id: minecraft:can_destroy_in_creative
    status: stub

  - id: minecraft:dyeable
    status: stub
    notes: Java minecraft:dyed_color.

  - id: minecraft:record
    status: stub
    notes: Java minecraft:jukebox_playable.

  - id: minecraft:tags
    status: stub
    notes: >-
      Bedrock item tags are ad-hoc strings; Java tags are registry-backed and bind to Item, which is
      one shared carrier here. Tag membership must therefore be evaluated by Lepus, not vanilla.

  - id: minecraft:custom_components
    status: stub
    notes: Script-registered custom components. Depends on SC-200.
