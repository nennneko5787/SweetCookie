# The component-group state machine. Bedrock events add and remove component groups on a live entity,
# which is the mechanism with no Java analogue at all - Java's EntityType is a fixed registry and its
# behaviour is compiled.
#
# Application order, re-entrancy and the recursion bound are TODO(SC-160): Bedrock's behaviour is
# undocumented and needs observation, not inference.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# Never write `implemented` by hand - specReport promotes it. Constitution rule 9.

domain: entity-events
spec: SC-160
upstream:
  - source: "metadata/doc_modules/entities.json"
    nodePath:
      - "Server Entity Documentation"
      - "Built-in Events"
  - source: "metadata/doc_modules/entities.json"
    nodePath:
      - "Server Entity Documentation"
      - "Triggers"

entries:
  - id: event/add
    status: stub
    notes: >-
      Supports Bedrock's %50 percentage-chance suffix, normalised to a 0..1 probability.
  - id: event/remove
    status: stub
  - id: event/sequence
    status: stub
  - id: event/randomize
    status: stub
    notes: >-
      Weighted choice; weights normalise at parse time.
  - id: event/filters
    status: stub
  - id: event/set_property
    status: stub
  - id: event/trigger
    status: stub
  - id: event/queue_command
    status: stub
    notes: >-
      Bedrock command string; SC-190 governs translation and unsupported commands are refused rather than
      approximated.
  - id: event/emit_vibration
    status: stub
