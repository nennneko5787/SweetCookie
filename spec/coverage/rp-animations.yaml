# A general skeletal keyframe system with MOLANG-VALUED keyframes, driven by finite state machines
# with Molang transition conditions. Java has nothing comparable for entities - this is effectively a
# second renderer.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: rp-animations
spec: SC-180
upstream: null

entries:
  - id: animation/bones
    status: stub
  - id: animation/rotation
    status: stub
  - id: animation/position
    status: stub
  - id: animation/scale
    status: stub
  - id: animation/lerp_mode
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationSampler
    notes: >-
      linear and catmullrom.
    fields:
      linear: ok
      catmullrom: ok
      step: missing
    fidelity: >-
      A segment is curved when EITHER of its two keyframes asks for it, which is the direction the
      reference implementation tests in - it takes the straight line only when the earlier keyframe
      is linear and the later one is linear or a step. The spline is the uniform tension-half
      Catmull-Rom through the two neighbouring keyframes as well as the segment's own ends, clamped
      at the ends of a channel. SC-180 section 4.1.2.

      Uniform, so keyframe times do not space the parameter. That is what the reference does and it
      is copied rather than improved on.

      A looping animation does not wrap: the reference joins the last keyframe to the first across
      the loop point and reaches round for the outer control points, and this holds the outermost
      keyframe instead.

      `step` is not read. It appears nowhere in the surveyed corpus, where a `pre`/`post` pair is
      the form used for a discontinuity.
  - id: animation/pre_post_keyframes
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationSampler
    notes: >-
      Allows a discontinuity at one instant.
    fields:
      pre: ok
      post: ok
    fidelity: >-
      A segment runs from its earlier keyframe's `post` to its later keyframe's `pre`, so a keyframe
      carrying both steps at that instant. A keyframe that steps also ends a Catmull-Rom curve: the
      neighbour past it is not reached for, because the pack asked for the discontinuity.

      NOT exercised by anything: no animation in the surveyed corpus writes two values. Claimed on
      unit tests and on the reference implementation's behaviour, not on a frame.

      Exactly at a keyframe's own time this answers `post`, the value it leaves with. The reference
      answers `pre` there. The difference is one instant of a discontinuity and nothing can see it.
  - id: animation/loop
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationSampler
    fields:
      "true": ok
      "false": ok
      hold_on_last_frame: missing
    fidelity: >-
      A looping animation wraps against `animation_length`; one that does not hold its last frame.
      The clock it wraps against is the HOLDER's, starting the first frame the animation's blend is
      non-zero - SC-180 section 4.1.1, and the reason a six-hundred-second animation in the surveyed
      corpus used to be at an arbitrary phase.

      `hold_on_last_frame` collapses to `loop: false` in the IR, so a plain non-looping animation
      cannot be told from a holding one. Bedrock ends both, but removes the pose of one and keeps
      the other. No animation in the surveyed corpus is plainly non-looping, so nothing can see the
      difference yet.

      `loop_delay` and `start_delay` are not read.
  - id: animation/loop_delay
    status: stub
  - id: animation/start_delay
    status: stub
  - id: animation/anim_time_update
    status: stub
    notes: >-
      Evaluated per frame; interaction with a variable frame rate is a fidelity concern.
  - id: animation/blend_weight
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationSampler
    fields:
      number: ok
      molang: ok
    fidelity: >-
      Read as a number or as Molang, evaluated per frame, and multiplied into the blend the playing
      entry of `scripts.animate` asks for - SC-180 section 4.1.1, where the two are shown to be one
      quantity stated from either end. Rotation and position scale by it; scale interpolates from
      one, because a blend of zero has to leave a bone the size it was.

      No animation in the surveyed corpus writes the field, so nothing observable exercises this. It
      is claimed on the parser and on unit tests, not on a frame.

      The DOCUMENT said this field was "parsed and not applied" for as long as the section existed,
      and it was not parsed at all. A capability nothing in the corpus exercises can be claimed by
      prose alone for a long time.
  - id: animation/override_previous_animation
    status: stub
  - id: animation/particle_effects
    status: stub
  - id: animation/sound_effects
    status: stub
  - id: animation/timeline
    status: stub
  - id: animation_controller/states
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationControllerPlayer
    fields:
      initial_state: ok
      animations: ok
      animations_blend: ok
      variables: missing
    fidelity: >-
      A state's animations are looked up in the entity's own `animations` map, and a name that map
      does not define plays nothing - which is the normal case, not an error. Mojang's elytra
      controller names five animations and the attachables that borrow it define two.

      The state is the HOLDER's, kept per entity id and slot, and the machine takes at most one
      transition per frame from where the last one left it - which is Bedrock's. SC-180 section 5.2.

      `on_entry`, `on_exit` and `query.all_animations_finished` are not read. `variables` is not
      read either.
  - id: animation_controller/transitions
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationControllerPlayer
    fields:
      order: ok
      molang_guard: ok
    fidelity: >-
      Ordered, first non-zero wins, as Mojang states. Guards written as numbers or booleans are read
      too - a guard of `1` is a transition that always fires, and dropping it would be a state the
      entity could never leave.

      One transition per frame, from the state the last frame left, as Bedrock does. A cycle in the
      pack's own file therefore flickers between two states rather than freezing - the surveyed
      corpus contains one, and both of its states draw nothing. SC-180 section 5.2.
  - id: animation_controller/blend_transition
    status: stub
    notes: >-
      Parsed and not applied: a cross-fade is a fact about the previous state, and nothing here
      remembers one. SC-180 section 5.2.
  - id: animation_controller/on_entry
    status: stub
  - id: animation_controller/on_exit
    status: stub
  - id: animation_controller/particle_effects
    status: stub
  - id: animation_controller/sound_effects
    status: stub
