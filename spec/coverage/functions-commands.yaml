# BEDROCK COMMANDS ARE NOT JAVA COMMANDS. Selectors differ, execute has a different grammar, and
# Bedrock has commands Java lacks entirely.
#
# Policy: translate what maps cleanly, REFUSE the rest with a diagnostic. Executing an approximation
# of a command a pack author wrote is worse than not executing it, because the failure becomes silent
# and the behaviour subtly wrong.
#
# Mojang ships a machine-readable command grammar; use it rather than hand-writing a parser.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# Never write `implemented` by hand - specReport promotes it. Constitution rule 9.

domain: functions-commands
spec: SC-190
upstream:
  source: "metadata/command_modules/mojang-commands.json"
