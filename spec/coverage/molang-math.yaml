# 61 pure functions. The easiest part of Molang and the one that must be exactly right, because
# everything else is built on it. All arithmetic is float (SC-000 section 7): folding in double and
# narrowing later changes which branch a pack takes.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.
#
# All 61 are implemented in float and unit-tested (ADR-0013), but they stay `stub` until something
# evaluates Molang in game: SC-000 section 3 reserves anything above `stub` for an observable
# runtime effect, and there is no runtime yet. A binding table test pins that this shard and
# MolangMathBinding name the same 61.

domain: molang-math
spec: SC-130
upstream:
  - source: "metadata/molang_modules/mojang-molang-queries.json"
    pointer: "/math_functions"
    idField: name

