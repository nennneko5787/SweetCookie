# A held or worn 3D model with its own geometry, animations and render controllers. NO Java equivalent - the largest single piece of work in SC-170.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: rp-attachables
spec: SC-170
upstream: null

entries:
  - id: attachable/geometry
    status: stub
  - id: attachable/materials
    status: stub
  - id: attachable/textures
    status: stub
  - id: attachable/animations
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AttachablePoser
    fields:
      animation: ok
      animation_controller: ok
    fidelity: >-
      Short name -> identifier, resolved against every enabled pack in order, animations first and
      controllers second. A name that resolves to neither is skipped: Mojang's own controllers are
      not in the add-on, and one pack in the corpus misspells one of its own entries.

      SC-180 sections 4 and 5 carry the divergences of what the resolved things then do.
  - id: attachable/animation_controllers
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AnimationControllerPlayer
    fields:
      shipped_by_the_pack: ok
      vanilla: missing
    fidelity: >-
      An entry of `scripts.animate` naming a controller now runs it. Resolution is by short name
      against the attachable's own `animations` map, animations first and controllers second, so a
      controller naming another controller resolves to nothing - nothing in the surveyed corpus does
      it, and it needs a cycle check rather than an ordering.

      A controller the add-on does not ship resolves to nothing and plays nothing. Two of the three
      attachables in the corpus name `controller.animation.elytra.default`, which is in Mojang's
      resource pack; that file may not be vendored (constitution rule 10) and is not fetched at
      runtime. Its five states name animations those attachables mostly do not define, so most of it
      would draw nothing even if it were resolved.

      The machine's state is kept per holder, one transition per frame. SC-180 section 5.2.
  - id: attachable/render_controllers
    status: stub
  - id: attachable/scripts
    status: partial
    impl: net.nennneko5787.lepus.core.format.render.AttachablePoser
    fields:
      pre_animation: ok
      animate: ok
      animate_blend: ok
      scale: missing
      initialize: missing
      parent_setup: missing
    fidelity: >-
      `pre_animation` runs first every frame, and its assignments are what the `animate` conditions
      read - evaluating them the other way round leaves every `v.` at zero, which answers "no" to
      every question a pack asks about itself.

      An `animate` entry's Molang expression is a BLEND AMOUNT, not a condition: SC-180 section
      4.1.1. Every condition in the surveyed corpus is a comparison answering zero or one, so this
      is indistinguishable there and differs for vanilla's own entries, which blend a walk by
      `query.modified_move_speed`.

      An entry naming an animation CONTROLLER rather than an animation runs it - SC-180 section 5 -
      unless the controller is one the add-on does not ship, which is the case for the two
      attachables naming Mojang's `controller.animation.elytra.default`.

      An animation's clock is the HOLDER's, starting the first frame that entry's blend is non-zero
      and running from then on whatever the blend does. `scripts.initialize`, `scripts.scale` and
      `scripts.variables` are still not read. SC-180 section 4.1.1.
  - id: attachable/item
    status: stub
    notes: >-
      Which items this attachable applies to.
  - id: attachable/first_person
    status: partial
    impl: net.nennneko5787.lepus.client.render.FirstPersonAttachables
    fields:
      main_hand: ok
      off_hand: ok
      worn_slots: missing
    fidelity: >-
      It does need its own path, and the reason is not that hand rendering is awkward: Bedrock does
      not draw an attachable at the hand at all. It poses it in PLAYER space, which in first person
      is a space the game never draws in, because no player model is submitted. So the space is
      rebuilt against the camera - the camera's pitch and its yaw-over-body undone, the origin then
      dropped to the feet, and the whole scaled by the 0.9375 a player model carries.

      ORDER, not sign, is what that list is about. Stepping down to the feet before undoing the
      pitch drops the model along a tilted axis, misplacing it by 1.62 sin(pitch) horizontally -
      "looking up moves her up and forward, looking down the reverse".

      Pitch is undone because a player layer is not pitched either; Java tilts the head bone, not
      the body. Yaw is taken back to the BODY's, because Minecraft lets head and body differ by
      fifty degrees and a camera-anchored model slides off the player's back as the mouse moves.

      A worn attachable is not drawn in first person. The seam is the hand render, which is offered
      the two hands and nothing else; the four armour slots reach the third-person layer only. A
      halo sits above and behind the eye and would be invisible anyway, but an armour attachable
      that reaches in front of the player is a real omission rather than a hidden one.

      Confirmed against the Bedrock client in COMPOSITION: the body-parented character appears at
      the screen's left, point-blank, face visible, on both clients - the product of three measured
      rules (channels independent and translation outermost, SC-180 section 4.1.3; conditions fire,
      section 4.4; the wearer's `body` carries a half turn in first person, section 4.2.1), each
      read off original-content probes rather than fitted.

      A sub-block placement residual remains and is deliberately not fitted: both clients draw this
      pass with a fixed projection that ignores the FOV setting (measured), so the residual is
      plausibly the two engines' fixed projections differing - not pack data, and a constant tuned
      to it would be a hand-fitted number of exactly the kind the constitution forbids.
  - id: attachable/worn
    status: partial
    impl: net.nennneko5787.lepus.client.render.AttachableLayer
    fields:
      head: ok
      chest: ok
      legs: ok
      feet: ok
      first_person: missing
    fidelity: >-
      A worn attachable reaches the render layer only because the stack's minecraft:equippable names
      an equipment asset. Vanilla filters what it puts on the render state -
      HumanoidMobRenderer.getEquipmentIfRenderable asks HumanoidArmorLayer.shouldRender, which asks
      assetId().isPresent() - so a stack without one leaves headEquipment and its three neighbours
      empty and the layer is handed nothing at all.

      The asset named is ours and draws nothing: it declares a single layer of a type no humanoid
      renders, because the codec rejects an empty layer map and any type a humanoid DOES render
      would put a flat armour piece over the model.

      This lives on the STACK, so a stack made by an older build carries an equippable without the
      asset and stays invisible until it is made again (SC-120 section 5). That is a real upgrade
      hazard, not only a development one.

      Vanilla's CustomHeadLayer still draws the item's own flat model on the head, beside the
      attachable. Bedrock shows only the attachable.
