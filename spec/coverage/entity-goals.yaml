# 171 goals. SEEDED PARTIALLY from research - `specUpstreamDiff` discovers the rest.
#
# Every goal becomes a Java Goal produced by a factory keyed on the component name. Priorities agree
# between the games: lower numbers run first. The goal set is REBUILT whenever component groups
# change, at a tick boundary, never mid-iteration.
#
# The generated table lives in docs/compatibility/entity-goals.md, not here.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# Never write `implemented` by hand - specReport promotes it. Constitution rule 9.

domain: entity-goals
spec: SC-160
upstream:
  source: "metadata/doc_modules/entities.json"
  pointer: "/data_items/AI Goals"

