# 120 components. SEEDED PARTIALLY from research - run `./gradlew fetchUpstreamMetadata
# specUpstreamDiff` to discover the rest. Missing entries are REPORTED, not silently absent, which is
# the point of the mechanism (constitution rule 9).
#
# Scope control matters more here than anywhere: implementing these in alphabetical order is how this
# project dies. The acceptance add-ons decide the order.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# `implemented` is written by hand and VERIFIED by the build - ADR-0011, constitution rule 9.

domain: entity-components
spec: SC-160
