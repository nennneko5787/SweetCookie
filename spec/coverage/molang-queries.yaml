# 315 queries. SEEDED PARTIALLY - `specUpstreamDiff` discovers the rest from Mojang's own
# machine-readable query manifest, which is the authoritative list.
#
# Queries are the bulk of the Molang work: the parser is not the hard part, the 315 bindings to
# Java-side state are. Several have no Java equivalent at all and will settle as wontfix with a
# documented constant.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# Never write `implemented` by hand - specReport promotes it. Constitution rule 9.

domain: molang-queries
spec: SC-130
upstream:
  source: "metadata/molang_modules/mojang-molang-queries.json"
  pointer: "/vanilla_data_modules/queries"
  idField: name

