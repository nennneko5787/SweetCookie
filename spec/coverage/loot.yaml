# Bedrock's loot format is a FORK of Java's PRE-1.13 format - not a subset, not a superset. Java has
# since moved to namespaced, registry-driven loot with number providers. Direct conversion is not
# possible; this is a real transform with real gaps.
#
# Emulating Bedrock-only functions is acceptable because Java's loot registry is data-driven.
#
# Status meanings: spec/normative/SC-000-conventions.md section 3.
# Never write `implemented` by hand - specReport promotes it. Constitution rule 9.

